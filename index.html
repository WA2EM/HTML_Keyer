<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyer Event Firehose</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    touch-action: none; /* stop page scroll/zoom from eating gestures we want to see */
  }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111;
    color: #eee;
    padding: 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  h1 { font-size: 1.05rem; margin: 0 0 4px 0; }
  p.sub { color: #999; font-size: 0.78rem; margin: 0 0 10px 0; }

  #controls { display: flex; gap: 8px; margin-bottom: 10px; }
  button {
    background: #333; color: #eee; border: 1px solid #555;
    padding: 8px 12px; border-radius: 6px; font-size: 0.85rem;
  }
  #status { font-size: 0.8rem; color: #6fd66f; margin-bottom: 8px; }

  #log {
    flex: 1;
    background: #000;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem;
    line-height: 1.5;
  }
  .row { white-space: pre-wrap; word-break: break-word; border-bottom: 1px solid #1a1a1a; padding: 2px 0; }
  .type-touch   { color: #6fbef2; }
  .type-pointer { color: #f2c96f; }
  .type-mouse   { color: #6fd66f; }
  .type-key     { color: #d66fd6; }
  .type-other   { color: #999; }
  .dt { color: #666; }
</style>
</head>
<body>

<h1>Keyer Event Firehose</h1>
<p class="sub">Logs every touch / pointer / mouse / keyboard event this page receives, with raw properties. Press your keyer's buttons and read what actually shows up below — don't assume, just look.</p>

<div id="controls">
  <button id="clear">Clear</button>
</div>
<div id="status">Waiting for input…</div>

<div id="log"></div>

<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  let lastTime = null;
  let count = 0;

  document.addEventListener('contextmenu', e => e.preventDefault());

  function line(cls, text) {
    const now = performance.now();
    const dt = lastTime !== null ? (now - lastTime).toFixed(1) : '---';
    lastTime = now;
    count++;
    const div = document.createElement('div');
    div.className = 'row ' + cls;
    div.textContent = `#${String(count).padStart(4,'0')} +${dt.padStart(7,' ')}ms  ${text}`;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.childNodes.length > 600) logEl.removeChild(logEl.firstChild);
    statusEl.textContent = `Last event: ${text}`;
  }

  // --- Touch events ---
  ['touchstart', 'touchend', 'touchcancel'].forEach(type => {
    document.addEventListener(type, (e) => {
      const t = e.changedTouches[0];
      line('type-touch', `TOUCH ${type}  touches=${e.touches.length} id=${t ? t.identifier : '?'} x=${t ? Math.round(t.clientX) : '?'} y=${t ? Math.round(t.clientY) : '?'} target=<${e.target.tagName.toLowerCase()}>`);
    }, { passive: true });
  });

  // --- Pointer events ---
  ['pointerdown', 'pointerup', 'pointercancel'].forEach(type => {
    document.addEventListener(type, (e) => {
      line('type-pointer', `POINTER ${type}  pointerType=${e.pointerType} button=${e.button} buttons=${e.buttons} id=${e.pointerId} isPrimary=${e.isPrimary} x=${Math.round(e.clientX)} y=${Math.round(e.clientY)}`);
    });
  });

  // --- Mouse events ---
  ['mousedown', 'mouseup', 'click', 'auxclick'].forEach(type => {
    document.addEventListener(type, (e) => {
      line('type-mouse', `MOUSE ${type}  button=${e.button} buttons=${e.buttons} x=${Math.round(e.clientX)} y=${Math.round(e.clientY)}`);
    });
  });

  // --- Keyboard events (in case the device emulates a keyboard instead) ---
  ['keydown', 'keyup'].forEach(type => {
    document.addEventListener(type, (e) => {
      line('type-key', `KEY ${type}  key="${e.key}" code="${e.code}"`);
    });
  });

  // --- Gamepad API (unlikely to apply, but cheap to check) ---
  window.addEventListener('gamepadconnected', (e) => {
    line('type-other', `GAMEPAD connected: ${e.gamepad.id}`);
  });

  document.getElementById('clear').addEventListener('click', () => {
    logEl.innerHTML = '';
    count = 0;
    lastTime = null;
    statusEl.textContent = 'Waiting for input…';
  });
</script>

</body>
</html>
